<!DOCTYPE html>
<html>
<head>
  <title>Reserva de Salas</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, select { margin: 5px; }
    .reserva { margin-top: 20px; }
  </style>
</head>
<body>

<h2>Reservar una Sala</h2>
<form id="reservaForm">
  Nombre: <input type="text" id="nombre" required><br>
  Sala:
  <select id="sala">
    <option>Sala de video 1</option>
    <option>Sala de video 2</option>
    <option>Sala de informática</option>
  </select><br>
  Fecha: <input type="date" id="fecha" required><br>
  Turno:
  <select id="turno">
    <option>Mañana</option>
    <option>Tarde</option>
    <option>Noche</option>
  </select><br>
  <button type="submit">Reservar</button>
</form>

<div class="reserva">
  <h3>Reservas de esta semana</h3>
  <ul id="listaReservas"></ul>
</div>

<script>
const reservas = [];

function esDeEstaSemana(fechaStr) {
  const fecha = new Date(fechaStr);
  const hoy = new Date();
  const primerDia = new Date(hoy.setDate(hoy.getDate() - hoy.getDay()));
  const ultimoDia = new Date(primerDia);
  ultimoDia.setDate(primerDia.getDate() + 6);
  return fecha >= primerDia && fecha <= ultimoDia;
}

document.getElementById("reservaForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const nombre = document.getElementById("nombre").value;
  const sala = document.getElementById("sala").value;
  const fecha = document.getElementById("fecha").value;
  const turno = document.getElementById("turno").value;

  reservas.push({ nombre, sala, fecha, turno });
  mostrarReservas();
});

function mostrarReservas() {
  const lista = document.getElementById("listaReservas");
  lista.innerHTML = "";
  reservas.filter(r => esDeEstaSemana(r.fecha)).forEach(r => {
    const item = document.createElement("li");
    item.textContent = `${r.fecha} - ${r.turno} - ${r.sala} (reservado por ${r.nombre})`;
    lista.appendChild(item);
  });
}
</script>

</body>
</html>
